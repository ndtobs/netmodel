# Lab inventory for netmodel
# Deploy lab: cd examples/lab && sudo clab deploy -t topology.yaml
# Run export: netmodel export @all -i examples/lab/inventory.yaml -o ./model/

defaults:
  username: admin
  password: admin
  port: 6030
  insecure: true

groups:
  spine:
    - spine1
  leaf:
    - leaf1
    - leaf2
  all:
    - spine1
    - leaf1
    - leaf2

hosts:
  spine1:
    address: clab-netsert-spine1
  leaf1:
    address: clab-netsert-leaf1
  leaf2:
    address: clab-netsert-leaf2
