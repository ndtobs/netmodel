# Example inventory file for netmodel
#
# Groups can reference other groups with @ prefix
# Defaults apply to all devices unless overridden

groups:
  spine:
    - spine1:6030
    - spine2:6030

  leaf:
    - leaf1:6030
    - leaf2:6030

  all:
    - "@spine"
    - "@leaf"

defaults:
  username: admin
  password: admin
  insecure: true
